          \ current_state\n    \n    # 超时逻辑：如果状态不为idle且超过15分钟，则自动重置\n    if current_state\
          \ != 'idle' and start_time_str:\n        try:\n            start_time =\
          \ datetime.fromisoformat(start_time_str).replace(tzinfo=timezone.utc)\n\
          \            if datetime.now(timezone.utc) - start_time > timedelta(minutes=15):\n\
          \                effective_state = 'idle'\n        except Exception:\n \
          \           pass\n    \n    return {\n        \"effective_state\": effective_state\n\
          \    }"
