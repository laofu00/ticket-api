    - data:
        code: "import json\n\ndef main(body: str):\n    \n    # 统一处理为字典\n    if isinstance(body,\
          \ dict):\n        data = body\n    else:\n        try:\n            data\
          \ = json.loads(body)\n        except:\n            data = {}\n    \n   \
          \ # 默认值\n    status = None\n    priority = None\n    fault_description =\
          \ None\n    location = None\n    business_success = False\n    message =\
          \ None\n    \n    # 状态和优先级的中文映射\n    status_map = {\n        \"pending\"\
          : \"待处理\",\n        \"processing\": \"处理中\",\n        \"completed\": \"\
          已完成\",\n        \"cancelled\": \"已取消\"\n    }\n    priority_map = {\n  \
          \      \"high\": \"高\",\n        \"medium\": \"中\",\n        \"low\": \"\
          低\"\n    }\n    \n    # 解析响应\n    if 'code' in data:\n        if data.get('code')\
          \ == 200:\n            info = data.get('data', {})\n            status =\
          \ info.get('status')\n            priority = info.get('priority')\n    \
          \        fault_description = info.get('faultDescription')\n            location\
          \ = info.get('location')\n            business_success = True\n        \
          \    message = \"查询成功\"\n        else:\n            message = data.get('message',\
          \ '查询失败，请稍后重试')\n    else:\n        if 'status' in data:\n            status\
          \ = data.get('status')\n            priority = data.get('priority')\n  \
          \          fault_description = data.get('faultDescription')\n          \
          \  location = data.get('location')\n            business_success = True\n\
          \            message = \"查询成功\"\n        else:\n            message = '工单不存在或返回格式异常'\n\
          \    \n    # 转换为中文\n    status_cn = status_map.get(status, status) if status\
          \ else None\n    priority_cn = priority_map.get(priority, priority) if priority\
          \ else None\n    \n    return {\n        \"status\": status,           #\
          \ 原始英文（可能为 None）\n        \"priority\": priority,       # 原始英文\n       \
          \ \"faultDescription\": fault_description,\n        \"location\": location,\n\
          \        \"message\": message,\n        \"businessSuccess\": business_success,\n\
          \        \"status_cn\": status_cn,     # 中文状态\n        \"priority_cn\":\
          \ priority_cn  # 中文优先级\n    }"
        code_language: python3
