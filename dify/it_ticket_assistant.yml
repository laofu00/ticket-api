    - data:
        code: "import json\nimport re\nimport time\n\ndef main(llm_output: str, pending_fault:\
          \ str = \"\"):\n    # 1. 清理前缀和转义\n    if isinstance(llm_output, str):\n\
          \        if 'llm_output :' in llm_output:\n            llm_output = llm_output.split('llm_output\
          \ :', 1)[-1].strip()\n        if llm_output.startswith('\"') and llm_output.endswith('\"\
          '):\n            llm_output = llm_output[1:-1]\n        llm_output = llm_output.replace('\\\
          \\\"', '\"')\n    \n    # 2. 提取 JSON 部分\n    match = re.search(r'\\{.*\\\
          }', llm_output, re.DOTALL)\n    if match:\n        json_str = match.group(0)\n\
          \    else:\n        json_str = llm_output\n    \n    # 3. 解析 JSON\n    location\
          \ = None\n    negative = None\n    try:\n        data = json.loads(json_str)\n\
          \        # 提取 location\n        raw_location = data.get('location')\n  \
          \      if raw_location and isinstance(raw_location, str):\n            location\
          \ = raw_location.strip()\n        # 提取 negative (可能是 \"no\" 或 null)\n  \
          \      raw_negative = data.get('negative')\n        if raw_negative == \"\
          no\":\n            negative = \"no\"\n        # 注意：如果 negative 是 null 或其他值，保持为\
          \ None\n    except Exception as e:\n        # 解析失败，保持 location 和 negative\
          \ 为 None\n        pass\n    \n    # 4. 根据 location 生成临时设备 ID\n    if location:\n\
          \        temp_id = f\"TEMP-{int(time.time())}\"\n    else:\n        temp_id\
          \ = \"UNKNOWN-DEVICE\"\n    \n    # 5. 判断用户是否放弃（negative == \"no\"）\n  \
          \  aborted = (not location) and (negative == \"no\")\n    \n    # 6. 返回结果\n\
          \    return {\n        \"location\": location,\n        \"faultDescription\"\
          : pending_fault,\n        \"priority\": \"medium\",\n        \"tempDeviceId\"\
          : temp_id,\n        \"aborted\": aborted   # 新增标志位，上游分支可据此判断用户取消位置提供\n \
          \   }"
